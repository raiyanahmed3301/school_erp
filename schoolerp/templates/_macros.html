{% macro field(label, name, value='', type='text', required=False, maxlength=None, hint='') -%}
<label class="field"><span>{{ label }}{% if required %} <b>*</b>{% endif %}</span>
<input type="{{ type }}" name="{{ name }}" value="{{ value if value is not none else '' }}"{% if required %} required{% endif %}{% if maxlength %} maxlength="{{ maxlength }}"{% endif %}{% if type=='number' %} step="any" min="0"{% endif %}>
{% if hint %}<small>{{ hint }}</small>{% endif %}</label>
{%- endmacro %}

{% macro select(label, name, options, selected='', required=False) -%}
<label class="field"><span>{{ label }}{% if required %} <b>*</b>{% endif %}</span>
<select name="{{ name }}"{% if required %} required{% endif %}>
{% for v, t in options %}<option value="{{ v }}"{% if v|string == selected|string %} selected{% endif %}>{{ t }}</option>{% endfor %}
</select></label>
{%- endmacro %}

{% macro badge(status) -%}<span class="badge b-{{ status }}">{{ status|replace('_',' ')|title }}</span>{%- endmacro %}
