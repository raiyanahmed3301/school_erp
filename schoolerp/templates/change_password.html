{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block body %}
<div class="card narrow"><h1>Change password</h1>
{% if g.user.must_change_password %}<p class="muted">Please choose your own password before continuing.</p>{% endif %}
<form method="post">{{ csrf_input() }}
<label class="field"><span>Current password</span><input type="password" name="current" autocomplete="current-password" required></label>
<label class="field"><span>New password</span><input type="password" name="new" autocomplete="new-password" required minlength="10" maxlength="128"><small>At least 10 characters, mixing letters and numbers/symbols.</small></label>
<label class="field"><span>Confirm new password</span><input type="password" name="confirm" autocomplete="new-password" required></label>
<button class="btn primary">Update password</button></form></div>
{% endblock %}
