{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<div class="card narrow login"><h1>☪ {{ school_name }}</h1><p class="muted">Staff sign in</p>
<form method="post">{{ csrf_input() }}
<label class="field"><span>Username</span><input name="username" autocomplete="username" required maxlength="64" autofocus></label>
<label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
<button class="btn primary wide">Sign in</button></form></div>
{% endblock %}
